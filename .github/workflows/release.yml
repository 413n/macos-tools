name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. Use current to ship whatever is in Info.plist.
        required: true
        type: choice
        default: current
        options:
          - current
          - patch
          - minor
          - major
      notes:
        description: Extra release notes (optional)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          version="$(bash ./scripts/bump-version.sh "${{ inputs.bump }}" --write)"
          tag="v${version}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Bump the version or delete the tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Build dist disk image
        run: ./build.sh --dist

      - name: Commit version bump
        if: ${{ inputs.bump != 'current' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/Info.plist
          if git diff --cached --quiet; then
            echo "Info.plist already at ${{ steps.version.outputs.version }}"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          dmg="build/NAF-Tools-${VERSION}.dmg"
          git tag "$TAG"
          git push origin "$TAG"
          title="NAF Tools ${VERSION}"
          if [[ -n "$NOTES" ]]; then
            gh release create "$TAG" "$dmg" --title "$title" --notes "$NOTES"
          else
            gh release create "$TAG" "$dmg" --title "$title" --generate-notes
          fi
